name: Continuous UNN Phone Enrichment Cloud Worker

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Number of candidates to enrich in this cloud run (0 for all remaining candidates)'
        required: false
        default: '0'
  push:
    paths:
      - '.github/workflows/enrich_admissions.yml'

permissions:
  contents: write

jobs:
  enrich-contacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run Candidate Phone Enrichment
        run: |
          python scripts/multi_worker_enrich.py 3

      - name: Commit and push updated Excel and checkpoint
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "KINGSOK Admissions Cloud Harvester"
          git add public/UNN_2026_2027*
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(admissions): cloud update verified phone numbers and Excel spreadsheets [skip ci]" && git push)
